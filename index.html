<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>EZ TMS Product Demos</title>
<link rel="icon" type="image/png" href="vendor/img/favicon-32x32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
  :root {
    --navy-deep: #0a1225;
    --navy: #182954;
    --navy-elevated: #34589c;
    --red: #ef151a;
    --red-hover: #d10f14;
    --text: #ffffff;
    --text-muted: #a9b4cc;
    --line: rgba(255, 255, 255, .10);
    --card: rgba(255, 255, 255, .04);
    --card-hover: rgba(255, 255, 255, .07);
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(1200px 600px at 50% -10%, var(--navy) 0%, var(--navy-deep) 70%) fixed, var(--navy-deep);
    color: var(--text);
    font-family: Inter, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .page { max-width: 1120px; margin: 0 auto; padding: 40px 16px 64px; }

  .eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--text-muted); margin: 0 0 10px; }
  .eyebrow { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
  /* Brand guidelines: white/reversed full mark on dark backgrounds, minimum width 90px */
  .eyebrow img { display: block; height: 28px; width: auto; }
  .eyebrow .divider { width: 1px; height: 18px; background: rgba(255, 255, 255, .25); }
  h1 { font-size: clamp(24px, 3.4vw, 34px); line-height: 1.15; letter-spacing: -.01em; font-weight: 700; margin: 0 0 8px; }
  .lede { color: var(--text-muted); font-size: 16px; line-height: 1.5; margin: 0 0 24px; max-width: 720px; text-wrap: pretty; }

  /* 16:9 window: the demo renders at 1280x720 and is scaled to fit */
  .stage {
    position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden;
    border-radius: 12px; background: #f9f9f9;
    box-shadow: 0 0 0 1px var(--line), 0 24px 60px rgba(0, 0, 0, .45);
  }
  .stage iframe {
    position: absolute; left: 0; top: 0; width: 1280px; height: 720px; border: 0;
    transform-origin: 0 0; pointer-events: none;
  }
  .stage .loading {
    position: absolute; inset: 0; display: grid; place-items: center;
    background: #f9f9f9; color: #6c757d; font-size: 14px; transition: opacity .3s;
  }
  .stage.is-ready .loading { opacity: 0; pointer-events: none; }

  .controls { display: flex; align-items: center; gap: 12px; margin-top: 20px; flex-wrap: wrap; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    height: 44px; padding: 0 22px; border-radius: 999px; border: 0;
    font: 600 15px/1 Inter, sans-serif; cursor: pointer;
    transition: background-color .15s, border-color .15s, opacity .15s, transform .1s;
  }
  .btn:active:not(:disabled) { transform: translateY(1px); }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
  .btn svg { width: 14px; height: 14px; }
  .btn-start { background: var(--red); color: #fff; min-width: 124px; }
  .btn-start:hover:not(:disabled) { background: var(--red-hover); }
  .btn-reset { background: transparent; color: #fff; box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, .35); }
  .btn-reset:hover:not(:disabled) { box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, .7); }
  .status { margin-left: auto; color: var(--text-muted); font-size: 14px; display: inline-flex; align-items: center; gap: 8px; }
  .status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-muted); }
  .status[data-state="playing"] .dot { background: var(--red); animation: pulse 1.2s ease-in-out infinite; }
  .status[data-state="ended"] .dot { background: #3ecf8e; }
  @keyframes pulse { 50% { opacity: .35; } }

  .list-head { display: flex; align-items: baseline; justify-content: space-between; margin: 56px 0 16px; border-top: 1px solid var(--line); padding-top: 28px; }
  .list-head h2 { font-size: 18px; font-weight: 600; margin: 0; }
  .list-head span { color: var(--text-muted); font-size: 14px; }
  .demos { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
  .demo {
    display: block; width: 100%; text-align: left; padding: 0; border: 0; cursor: pointer;
    background: var(--card); color: inherit; border-radius: 12px; overflow: hidden;
    box-shadow: 0 0 0 1px var(--line); transition: background-color .15s, box-shadow .15s;
    font: inherit;
  }
  .demo:hover { background: var(--card-hover); }
  .demo:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
  .demo[aria-current="true"] { box-shadow: 0 0 0 2px var(--red); }
  .demo img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; background: #f9f9f9; }
  .demo .body { padding: 14px 16px 16px; }
  .demo .meta { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
  .demo .tag { font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
  .demo .now { margin-left: auto; color: #fff; background: var(--red); border-radius: 999px; padding: 2px 8px; font-weight: 600; display: none; }
  .demo[aria-current="true"] .now { display: inline-block; }
  .demo h3 { font-size: 15px; font-weight: 600; margin: 0 0 4px; line-height: 1.35; }
  .demo p { font-size: 13px; color: var(--text-muted); margin: 0; line-height: 1.45; }

  footer { margin-top: 48px; color: var(--text-muted); font-size: 12px; }

  @media (max-width: 600px) {
    .page { padding-top: 28px; }
    .status { margin-left: 0; width: 100%; }
    .btn { flex: 1; }
  }
</style>
</head>
<body>
<main class="page">
  <p class="eyebrow"><img src="img/ez-tms-logo-white.png" alt="EZ TMS" width="94" height="28"><span class="divider" aria-hidden="true"></span><span>Product demos</span></p>
  <h1 id="demoTitle">Loading…</h1>
  <p class="lede" id="demoDesc"></p>

  <div class="stage" id="stage">
    <iframe id="frame" title="EZ TMS demo" tabindex="-1"></iframe>
    <div class="loading">Loading demo…</div>
  </div>

  <div class="controls">
    <button class="btn btn-start" id="btnStart" type="button" disabled>
      <svg viewBox="0 0 14 14" aria-hidden="true"><path d="M3 1.5v11l9-5.5z" fill="currentColor"/></svg>
      <span>Start</span>
    </button>
    <button class="btn btn-reset" id="btnReset" type="button" disabled>
      <svg viewBox="0 0 14 14" aria-hidden="true"><path d="M2.5 7a4.5 4.5 0 1 0 1.3-3.2M2.5 1.5v2.8h2.8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Reset</span>
    </button>
    <span class="status" id="status" data-state="loading" aria-live="polite"><span class="dot"></span><span id="statusText">Loading</span></span>
  </div>

  <section aria-labelledby="listTitle">
    <div class="list-head">
      <h2 id="listTitle">Demos</h2>
      <span id="listCount"></span>
    </div>
    <ul class="demos" id="demoList"></ul>
  </section>

  <footer>Interactive recreation of the EZ TMS interface. All data shown is sample data.</footer>
</main>

<script>
  // Add a demo here: its page, a 16:9 poster image, and how long it runs.
  const DEMOS = [
    {
      id: 'post-a-load',
      area: 'Loadboard',
      title: 'Post a load to the loadboard',
      description: 'Create a load posting from the Loadboard. One zip code fills in the city and state for each stop.',
      page: 'loadboard-demo.html',
      poster: 'posters/post-a-load.jpg',
      duration: '0:44',
    },
  ];

  const $ = id => document.getElementById(id);
  const stage = $('stage'), frame = $('frame'), btnStart = $('btnStart'), btnReset = $('btnReset');
  const STATUS = { loading: 'Loading', ready: 'Ready', playing: 'Playing', ended: 'Finished' };
  let current = null, state = 'loading';

  function fit() { frame.style.transform = `scale(${stage.clientWidth / 1280})`; }
  new ResizeObserver(fit).observe(stage);

  function setState(next) {
    state = next;
    $('status').dataset.state = next;
    $('statusText').textContent = STATUS[next];
    stage.classList.toggle('is-ready', next !== 'loading');
    btnStart.disabled = next === 'loading' || next === 'playing';
    btnReset.disabled = next === 'loading' || next === 'ready';
  }

  function demoApi() { try { return frame.contentWindow.ezdemo; } catch (e) { return null; } }

  function select(id, { updateHash = true } = {}) {
    const demo = DEMOS.find(d => d.id === id) || DEMOS[0];
    if (current && current.id === demo.id) return;
    current = demo;
    setState('loading');
    frame.src = `${demo.page}?autoplay=0&loop=0`;
    $('demoTitle').textContent = demo.title;
    $('demoDesc').textContent = demo.description;
    document.title = `${demo.title} · EZ TMS Product Demos`;
    document.querySelectorAll('.demo').forEach(el => el.setAttribute('aria-current', String(el.dataset.id === demo.id)));
    if (updateHash) history.replaceState(null, '', `#${demo.id}`);
  }

  function renderList() {
    $('demoList').innerHTML = DEMOS.map(d => `
      <li>
        <button class="demo" type="button" data-id="${d.id}" aria-current="false">
          <img src="${d.poster}" alt="" loading="lazy">
          <div class="body">
            <div class="meta"><span class="tag">${d.area}</span><span>· ${d.duration}</span><span class="now">Now showing</span></div>
            <h3>${d.title}</h3>
            <p>${d.description}</p>
          </div>
        </button>
      </li>`).join('');
    $('listCount').textContent = `${DEMOS.length} ${DEMOS.length === 1 ? 'demo' : 'demos'}`;
    $('demoList').addEventListener('click', e => {
      const card = e.target.closest('.demo');
      if (!card) return;
      select(card.dataset.id);
      stage.scrollIntoView({ behavior: 'smooth', block: 'center' });
    });
  }

  window.addEventListener('message', e => {
    if (e.source !== frame.contentWindow || !e.data || e.data.source !== 'ezdemo') return;
    if (STATUS[e.data.state]) setState(e.data.state);
  });

  btnStart.addEventListener('click', () => { const api = demoApi(); if (api) { setState('playing'); api.restart(); } });
  btnReset.addEventListener('click', () => { const api = demoApi(); if (api) api.stop(); });
  window.addEventListener('hashchange', () => select(location.hash.slice(1), { updateHash: false }));

  renderList();
  select(location.hash.slice(1), { updateHash: false });
  fit();
</script>
</body>
</html>
